const $ = id => document.getElementById(id);
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const ui = { refreshers: [], propRefreshers: [], list: null, currentPreset: 'precession', propsFor: null, listSig: '' };
let refreshTarget = ui.refreshers;
const isEditing = el => document.activeElement === el;

/* slider: {label, min, max, step, get, set, fmt, log, tip} (log: the slider moves in log10) */
function slider(o) {
  const val = h('b');
  const inp = h('input', { type: 'range', min: o.min, max: o.max, step: o.step ?? 'any' });
  const toS = v => o.log ? Math.log10(v) : v, fromS = v => o.log ? Math.pow(10, v) : v;
  const upd = () => { const v = o.get(); if (!isEditing(inp)) inp.value = toS(v); val.textContent = o.fmt ? o.fmt(v) : fmtNum(v); };
  inp.addEventListener('input', () => { o.set(fromS(parseFloat(inp.value))); upd(); });
  refreshTarget.push(upd); upd();
  return h('div', { class: 'ctl', title: o.tip }, h('div', { class: 'lbl' }, h('span', {}, o.label), val), inp);
}
function check(o) {
  const inp = h('input', { type: 'checkbox' });
  inp.addEventListener('change', () => o.set(inp.checked));
  refreshTarget.push(() => { inp.checked = !!o.get(); });
  inp.checked = !!o.get();
  return h('label', { class: 'chk', title: o.tip }, inp, o.label);
}
function choice(o) {
  const sel = h('select', { class: 'grow' }, o.options.map(([v, t]) => h('option', { value: v }, t)));
  sel.addEventListener('change', () => o.set(sel.value));
  refreshTarget.push(() => { if (!isEditing(sel)) sel.value = o.get(); });
  sel.value = o.get();
  return h('div', { class: 'row', title: o.tip }, h('span', { style: 'color:var(--dim)' }, o.label), sel);
}
function kv(label, fn, tip) {
  const b = h('b');

  return h('div', { class: 'kv', title: tip }, h('span', {}, label), b);
}
/* number input bound to a getter/setter; scale converts internal -> displayed unit */
function numInput(get, set, scale = 1, digits = 5) {
  const inp = h('input', { type: 'number', step: 'any' });
  const upd = () => { if (!isEditing(inp)) { const v = get() * scale; inp.value = Number(v.toPrecision(digits)); } };
  inp.addEventListener('change', () => { const v = parseFloat(inp.value); if (isFinite(v)) set(v / scale); upd(); });
  refreshTarget.push(upd); upd();

}

function simWarnings() {
  const w = [];
  if (sim.relax > 1.05) w.push(`⚠ Simulation nicht mehr genau – Schritte ×${sim.relax.toFixed(1)} vergröbert`);
  if (physInfo.frac < 0.98 && !settings.paused) w.push(`⚠ Tempo begrenzt: effektiv ×${fmtNum(settings.timeScale * physInfo.frac, 3)}`);
  if (Math.abs(energyDrift) > 1e-2) w.push('⚠ Große Energiedrift – Genauigkeit erhöhen oder langsamer laufen');
  else if (sim.pn && sim.n >= 3 && Math.abs(energyDrift) > 1e-4) w.push('<span style="color:var(--dim);font-weight:400">Hinweis: 1PN mit ≥3 Körpern – Energie nur näherungsweise erhalten</span>');
  if (sim.bodies.filter(b => b.type !== 'bh').length > 32) w.push('Nur die 32 nächsten Körper werden im 3D-Bild gerendert');
  return w;
}

function suggestHelperDistance() {
  const c = selected();
  if (!c) return;
  const t = orbitHelper.comp.startsWith('new:') ? orbitHelper.comp.slice(4) : (sim.bodies.find(b => 'id:' + b.id === orbitHelper.comp)?.type || 'planet');
  orbitHelper.dist = Number(suggestDistance(c, t).toPrecision(3));
}
function doCircularOrbit() {
  const c = selected();
  if (!c) { toast('Bitte zuerst den Zentralkörper auswählen', true); return; }
  let comp;
  if (orbitHelper.comp.startsWith('new:')) {
    if (sim.bodies.length >= MAX_BODIES) { toast(`Maximal ${MAX_BODIES} Körper`, true); return; }
    comp = makeBody(defaultBody(orbitHelper.comp.slice(4)));
    sim.bodies.push(comp);
  } else comp = sim.bodies.find(b => 'id:' + b.id === orbitHelper.comp);
  if (!comp || comp === c) return;
  const minD = (c.R || 0) + (comp.R || 0) + (c.type === 'bh' ? rsOf(c.m) * 2 : 0);
  if (orbitHelper.dist <= minD) { toast('Abstand zu klein – die Körper würden sich berühren', true); if (orbitHelper.comp.startsWith('new:')) sim.bodies.pop(); return; }
  setCircularOrbit(c, comp, orbitHelper.dist, orbitHelper.inc, orbitHelper.phase, orbitHelper.retro);
  sim.reset();
  toast(`${comp.name} kreist jetzt um ${c.name} (r = ${fmtNum(orbitHelper.dist, 3)} AE)`);
  if (orbitHelper.comp.startsWith('new:')) orbitHelper.phase = (orbitHelper.phase + 137.5) % 360;   // next one elsewhere
}

/* ---- body list + property editor (rebuilt when the structure changes) ---- */
function refreshBodyList() {
  const sig = sim.bodies.map(b => `${b.id}:${b.name}:${b.type}:${b.color}`).join('|') + '#' + selectedId;
  if (sig !== ui.listSig) {
    ui.listSig = sig;
    ui.list.innerHTML = '';
    if (!sim.bodies.length) ui.list.append(h('div', { class: 'hint', style: 'padding:6px' }, 'Leer – füge oben Körper hinzu.'));
    for (const b of sim.bodies) {
      const it = h('div', { class: 'item' + (b.id === selectedId ? ' sel' : ''), onclick: () => selectBody(b),
        ondblclick: () => { selectBody(b); camera.follow = 'sel'; toast('Kamera folgt ' + b.name); }, title: 'Klick: auswählen · Doppelklick: Kamera folgt' },
        h('span', { class: 'dot' + (b.type === 'bh' ? ' bh' : ''), style: `background:${b.color}` }),
        h('span', { class: 'nm' }, b.name), h('span', { class: 'ms', 'data-id': b.id }, ''),
        h('button', { class: 'x danger', title: 'Löschen', onclick: e => { e.stopPropagation(); deleteBody(b); } }, '×'));
      ui.list.append(it);
    }
  }
  for (const sp of ui.list.querySelectorAll('.ms')) {
    const b = sim.bodies.find(q => q.id === +sp.dataset.id);
    if (b) sp.textContent = TYPE_NAMES[b.type] + ' · ' + fmtMass(b.m);
  }
  // property panel
  const s = selected();
  const key = s ? s.id + ':' + s.type : 'none';
  if (ui.propsFor !== key) { ui.propsFor = key; buildProps(s); }
  for (const f of ui.propRefreshers) f();
}

function buildProps(b) {
  const P = ui.props;
  P.innerHTML = '';
  ui.propRefreshers = [];
  refreshTarget = ui.propRefreshers;
  if (!b) { P.append(h('div', { class: 'hint' }, 'Kein Körper ausgewählt. Klicke in der Liste, im 3D-Bild oder in der Karte auf einen Körper.')); refreshTarget = ui.refreshers; return; }
  const changed = () => { sim.reset(); };
  const name = h('input', { type: 'text', class: 'grow', value: b.name });

/* =============================================================================
   12. TOP-DOWN VIEW (2D canvas): overview, trails, placement, spacetime grid
   ============================================================================= */
/* Predict the path of one body (index `idx` in a copy of the current state, possibly
   with an extra body appended) with the same leapfrog scheme. Returns [x0,y0,x1,y1,...]. */
function predictPath(extra, overrideIdx, overridePos, overrideVel, maxMs = 10) {
  const B = sim.bodies;
  const n = B.length + (extra ? 1 : 0);
  const x = new Float64Array(n), y = new Float64Array(n), z = new Float64Array(n);
  const vx = new Float64Array(n), vy = new Float64Array(n), vz = new Float64Array(n), m = new Float64Array(n);
  const ax = new Float64Array(n), ay = new Float64Array(n), az = new Float64Array(n);
  B.forEach((b, i) => { x[i] = b.pos[0]; y[i] = b.pos[1]; z[i] = b.pos[2]; vx[i] = b.vel[0]; vy[i] = b.vel[1]; vz[i] = b.vel[2]; m[i] = b.m; });
  let k = overrideIdx;
  if (extra) { k = n - 1; m[k] = extra.m; }
  if (overridePos) { x[k] = overridePos[0]; y[k] = overridePos[1]; z[k] = overridePos[2]; }
  if (overrideVel) { vx[k] = overrideVel[0]; vy[k] = overrideVel[1]; vz[k] = overrideVel[2]; }
  // prediction horizon: ~1 orbit around the dominant attractor (vis-viva), else a flyby time
  const dom = dominantAttractor([x[k], y[k], z[k]], extra ? null : B[k]);
  let T = 10;
  if (dom) {
    const r = Math.hypot(x[k] - dom.pos[0], y[k] - dom.pos[1], z[k] - dom.pos[2]);
    const v2 = (vx[k] - dom.vel[0]) ** 2 + (vy[k] - dom.vel[1]) ** 2 + (vz[k] - dom.vel[2]) ** 2;
    const mu = G * (dom.m + m[k]);
    const eps = v2 / 2 - mu / r;
    T = eps < 0 ? 1.02 * 2 * Math.PI * Math.sqrt((-mu / (2 * eps)) ** 3 / mu) : 6 * r / Math.sqrt(v2 + 1e-12);
    T = Math.min(T, 400 * 2 * Math.PI * Math.sqrt(r ** 3 / mu));
  }
  const acc = () => {
    let tau2 = Infinity;
    for (let i = 0; i < n; i++) { ax[i] = 0; ay[i] = 0; az[i] = 0; }
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const dx = x[j] - x[i], dy = y[j] - y[i], dz = z[j] - z[i];
      const r2 = dx * dx + dy * dy + dz * dz + SOFT2, r = Math.sqrt(r2), s = 1 / (r2 * r);
      ax[i] += m[j] * s * dx; ay[i] += m[j] * s * dy; az[i] += m[j] * s * dz;
      ax[j] -= m[i] * s * dx; ay[j] -= m[i] * s * dy; az[j] -= m[i] * s * dz;
      if (i === k || j === k || n < 12) {
        const t1 = r2 * r / (m[i] + m[j] + 1e-30);
        const dv2 = (vx[j] - vx[i]) ** 2 + (vy[j] - vy[i]) ** 2 + (vz[j] - vz[i]) ** 2;
        tau2 = Math.min(tau2, t1, dv2 > 0 ? r2 / dv2 : Infinity);
      }
    }
    return 0.02 * Math.sqrt(tau2);
  };
  const out = [x[k], y[k]];
  let t = 0, dt = acc(), steps = 0;
  const t0 = performance.now();
  let lastX = x[k], lastY = y[k];
  const minSeg2 = (T * Math.sqrt(vx[k] ** 2 + vy[k] ** 2) / 400) ** 2;
  while (t < T && steps < 20000) {
    dt = Math.min(dt, T - t) || 1e-6;
    for (let i = 0; i < n; i++) { vx[i] += ax[i] * dt / 2; vy[i] += ay[i] * dt / 2; vz[i] += az[i] * dt / 2; x[i] += vx[i] * dt; y[i] += vy[i] * dt; z[i] += vz[i] * dt; }
    const dtn = acc();
    for (let i = 0; i < n; i++) { vx[i] += ax[i] * dt / 2; vy[i] += ay[i] * dt / 2; vz[i] += az[i] * dt / 2; }
    t += dt; dt = dtn; steps++;
    if ((x[k] - lastX) ** 2 + (y[k] - lastY) ** 2 > minSeg2) { out.push(x[k], y[k]); lastX = x[k]; lastY = y[k]; }
    if ((steps & 63) === 0 && performance.now() - t0 > maxMs) break;
  }
  out.push(x[k], y[k]);
  return out;
}

class TopDown {
  constructor(cv) {
    this.cv = cv; this.ctx = cv.getContext('2d');
    this.cx = 0; this.cy = 0; this.scale = 30;    // px per AU (CSS px)
    this.follow = true;
    this.mode = 'select';                         // 'select' | 'place'
    this.placeType = 'planet';
    this.grid = false;
    this.drag = null;                             // current interaction
    this.pred = null;                             // predicted path
    this.ghost = null;
    this.buildTools();
    cv.addEventListener('pointerdown', e => this.onDown(e));
    cv.addEventListener('pointermove', e => this.onMove(e));
    cv.addEventListener('pointerup', e => this.onUp(e));
    cv.addEventListener('pointercancel', () => { this.drag = null; this.pred = null; this.ghost = null; });
    cv.addEventListener('wheel', e => {
      e.preventDefault();
      const [wx, wy] = this.toWorld(e.offsetX, e.offsetY);
      const f = Math.pow(1.0015, -e.deltaY);
      this.scale = Math.min(1e6, Math.max(1e-3, this.scale * f));
      const [nx, ny] = this.toWorld(e.offsetX, e.offsetY);
      this.cx += wx - nx; this.cy += wy - ny; this.follow = false;
    }, { passive: false });
    cv.addEventListener('contextmenu', e => e.preventDefault());
  }
  buildTools() {
    const T = $('mapTools');
    const bSel = h('button', { onclick: () => { this.mode = 'select'; this.ghost = null; } }, 'Auswahl');
    const bPlace = h('button', { onclick: () => { this.mode = 'place'; } }, 'Platzieren:');
    const tSel = h('select', {}, [['planet', 'Planet'], ['moon', 'Mond'], ['star', 'Stern'], ['bh', 'Schw. Loch']].map(([v, t]) => h('option', { value: v }, t)));
    tSel.addEventListener('change', () => { this.placeType = tSel.value; this.mode = 'place'; });
    const bGrid = h('button', { onclick: () => { this.grid = !this.grid; }, title: 'Raumzeit-Gitter: Gummituch, das sich um Massen eindellt' }, 'Raumzeit-Gitter');
    const bFit = h('button', { onclick: () => { this.follow = true; this.fit(); }, title: 'Alle Körper einpassen und der 3D-Kamera folgen' }, 'Zentrieren');
    const bBig = h('button', { onclick: () => $('mapBox').classList.toggle('big'), title: 'Größe umschalten' }, '⤢');
    T.append(bSel, bPlace, tSel, bGrid, bFit, bBig);
    ui.refreshers.push(() => {
      bSel.classList.toggle('on', this.mode === 'select'); bPlace.classList.toggle('on', this.mode === 'place');
      bGrid.classList.toggle('on', this.grid); bFit.classList.toggle('on', this.follow);
      $('mapHint').textContent = this.mode === 'place'
        ? `Klick: ${TYPE_NAMES[this.placeType]} auf Kreisbahn · Klick+Ziehen: Geschwindigkeit · Esc: Ende`
        : 'Klick: auswählen · Ziehen: verschieben · Shift+Ziehen: Geschwindigkeit · Rad: Zoom';
    });
  }
  size() {
    const r = this.cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(r.width * dpr), hh = Math.round(r.height * dpr);
    if (this.cv.width !== w || this.cv.height !== hh) { this.cv.width = w; this.cv.height = hh; }
    return { w: r.width, h: r.height, dpr };
  }
  toScreen(x, y) { const { w, h: hh } = this.dim; return [w / 2 + (x - this.cx) * this.scale, hh / 2 - (y - this.cy) * this.scale]; }
  toWorld(sx, sy) { const { w, h: hh } = this.dim || this.size(); return [this.cx + (sx - w / 2) / this.scale, this.cy - (sy - hh / 2) / this.scale]; }
  fit() {
    this.dim = this.size();
    const B = sim.bodies;
    if (!B.length) { this.cx = camera.target[0]; this.cy = camera.target[1]; this.scale = 30; return; }
    // robust extent: centre on the heaviest body, radius = 90th percentile of distances
    const heavy = [...B].sort((p, q) => q.m - p.m)[0];
    const c = camera.follow === 'free' ? camera.target : heavy.pos;
    const ds = B.map(b => Math.hypot(b.pos[0] - c[0], b.pos[1] - c[1]) + b.R).sort((a, b) => a - b);
    let ext = Math.max(ds.length <= 6 ? ds[ds.length - 1] : ds[Math.ceil(0.9 * (ds.length - 1))], 0.3);
    const pbh = primaryBH();
    if (pbh) ext = Math.max(ext, 30 * G * pbh.m / C_LIGHT ** 2);
    this.cx = c[0]; this.cy = c[1];
    this.scale = 0.42 * Math.min(this.dim.w, this.dim.h) / ext;
  }
  pick(sx, sy) {
    let best = null, bd = 14;
    for (const b of sim.bodies) {
      const [px, py] = this.toScreen(b.pos[0], b.pos[1]);
      const d = Math.hypot(px - sx, py - sy) - this.bodyPx(b);
      if (d < bd) { bd = d; best = b; }
    }
    return best;
  }
  bodyPx(b) {
    if (b.type === 'bh') return Math.max(rsOf(b.m) * this.scale, 4);
    return Math.max(b.R * this.scale, b.type === 'star' ? 4.5 : b.type === 'moon' ? 2 : 3);
  }
  /* Reference speed (80 px arrow): circular speed around the reference body, or – for the
     heaviest body – the circular speed around it at 100 px distance. */
  refSpeed(pos, b) {
    const ref = b ? referenceBody(b) : dominantAttractor(pos, null);
    if (ref) return Math.sqrt(G * ref.m / Math.max(V.len(V.sub(pos, ref.pos)), 1e-6));
    return Math.sqrt(G * Math.max(b ? b.m : 1, 1e-6) / (100 / this.scale));
  }
  /* velocity for a drag of (dxs, dys) screen pixels: 80 px = reference speed */
  dragVelocity(pos, dxs, dys, b) {
    const ref = b ? referenceBody(b) : dominantAttractor(pos, null);
    const vc = this.refSpeed(pos, b);
    const base = ref ? ref.vel : [0, 0, 0];
    return V.add(base, [dxs / 80 * vc, -dys / 80 * vc, 0]);
  }
  onDown(e) {
    this.cv.setPointerCapture(e.pointerId);
    this.dim = this.size();
    const sx = e.offsetX, sy = e.offsetY;
    const [wx, wy] = this.toWorld(sx, sy);
    if (e.button === 2 || e.button === 1) { this.drag = { kind: 'pan', sx, sy, cx: this.cx, cy: this.cy }; return; }
    if (this.mode === 'place') {
      if (sim.bodies.length >= MAX_BODIES) { toast(`Maximal ${MAX_BODIES} Körper`, true); return; }
      const dom = dominantAttractor([wx, wy, 0], null);
      const z = dom ? dom.pos[2] : 0;
      this.ghost = { pos: [wx, wy, z], sx, sy, vel: null };
      this.drag = { kind: 'place', sx, sy };
      return;
    }
    const b = this.pick(sx, sy);
    if (b) {
      selectBody(b);
      this.drag = e.shiftKey ? { kind: 'vel', b, sx, sy } : { kind: 'move', b, sx, sy, moved: false, off: [b.pos[0] - wx, b.pos[1] - wy] };
    } else this.drag = { kind: 'pan', sx, sy, cx: this.cx, cy: this.cy };
  }
  onMove(e) {
    const d = this.drag;
    if (!d) return;
    const sx = e.offsetX, sy = e.offsetY;
    const [wx, wy] = this.toWorld(sx, sy);
    if (d.kind === 'pan') {
      this.cx = d.cx - (sx - d.sx) / this.scale; this.cy = d.cy + (sy - d.sy) / this.scale;
      if (Math.hypot(sx - d.sx, sy - d.sy) > 3) this.follow = false;
    } else if (d.kind === 'move') {
      if (Math.hypot(sx - d.sx, sy - d.sy) < 3 && !d.moved) return;
      d.moved = true;
      d.b.pos[0] = wx + d.off[0]; d.b.pos[1] = wy + d.off[1];
      if (d.b.trail) d.b.trail.clear();
      sim.reset();
    } else if (d.kind === 'vel') {
      d.vel = this.dragVelocity(d.b.pos, sx - d.sx, sy - d.sy, d.b);
      d.ex = sx; d.ey = sy;
      this.pred = predictPath(null, sim.bodies.indexOf(d.b), null, d.vel);
    } else if (d.kind === 'place') {
      const g = this.ghost;
      if (Math.hypot(sx - d.sx, sy - d.sy) > 5) {
        g.vel = this.dragVelocity(g.pos, sx - d.sx, sy - d.sy, null);
        g.ex = sx; g.ey = sy;
        this.pred = predictPath(defaultBody(this.placeType), null, g.pos, g.vel);
      } else { g.vel = null; this.pred = null; }
    }
  }
  onUp(e) {
    const d = this.drag;
    this.drag = null;
    if (!d) return;
    if (d.kind === 'vel' && d.vel) {
      d.b.vel = d.vel; if (d.b.trail) d.b.trail.clear(); sim.reset();
      toast(`${d.b.name}: neue Geschwindigkeit ${fmtNum(V.len(d.vel) / KMS, 3)} km/s`);
    } else if (d.kind === 'place' && this.ghost) {
      const g = this.ghost;
      const b = makeBody(defaultBody(this.placeType));
      b.pos = g.pos.slice();
      sim.bodies.push(b);
      if (g.vel) b.vel = g.vel;
      else {
        const dom = dominantAttractor(b.pos, b);
        if (dom) {
          const rel = V.sub(b.pos, dom.pos), r = V.len(rel);
          if (r > dom.R + b.R + (dom.type === 'bh' ? rsOf(dom.m) : 0)) {
            const t = V.norm(V.cross([0, 0, 1], rel));
            b.vel = V.add(dom.vel, V.mul(t, circularSpeed(dom, b, r)));
          } else b.vel = dom.vel.slice();
        }
      }
      sim.reset();
      selectBody(b);
      toast(`${b.name} platziert`);
      this.ghost = null;
    }
    this.pred = null;
  }

  draw() {
    const mb = $('mapBox');
    if (mb.classList.contains('hidden')) return;
    this.dim = this.size();
    const { w, h: H, dpr } = this.dim;
    const ctx = this.ctx;
    if (this.follow && !this.drag) { this.cx = camera.target[0]; this.cy = camera.target[1]; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, H);
    if (this.grid) this.drawGrid(ctx, w, H);
    else this.drawPlainGrid(ctx, w, H);
    // trails
    for (const b of sim.bodies) {
      const tr = b.trail;
      if (!tr || tr.n < 2) continue;
      ctx.strokeStyle = b.type === 'bh' ? '#ff9d3a' : b.color;
      ctx.lineWidth = 1.2;
      const G8 = 8, per = Math.ceil(tr.n / G8);
      for (let g = 0; g < G8; g++) {
        const k0 = g * per, k1 = Math.min(tr.n - 1, (g + 1) * per);
        if (k1 <= k0) continue;
        ctx.globalAlpha = 0.08 + 0.75 * Math.pow((g + 1) / G8, 1.6);
        ctx.beginPath();
        for (let k = k0; k <= k1; k++) {
          const i = tr.idx(k);
          const [px, py] = this.toScreen(tr.buf[i], tr.buf[i + 1]);
          k === k0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    // debris
    const D = sim.debris;
    if (D.n) {
      ctx.fillStyle = 'rgba(255,190,120,0.75)';
      const step = Math.max(1, Math.floor(D.n / 3000));
      for (let i = 0; i < D.n; i += step) { const [px, py] = this.toScreen(D.x[i], D.y[i]); ctx.fillRect(px - 0.6, py - 0.6, 1.2, 1.2); }
    }
    // bodies
    const pbh = primaryBH();
    for (const b of sim.bodies) {
      const [px, py] = this.toScreen(b.pos[0], b.pos[1]);
      if (px < -50 || py < -50 || px > w + 50 || py > H + 50) continue;
      const rp = this.bodyPx(b);
      if (b.type === 'bh') {
        if (b === pbh && settings.disk.on) {
          const ro = settings.disk.outer * G * b.m / C_LIGHT ** 2 * this.scale;
          if (ro > rp + 2) {
            const gr = ctx.createRadialGradient(px, py, rp, px, py, ro);
            gr.addColorStop(0, 'rgba(255,170,80,0.32)'); gr.addColorStop(1, 'rgba(255,120,40,0)');
            ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(px, py, ro, 0, 7); ctx.fill();
          }
        }
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(px, py, rp, 0, 7); ctx.fill();
        ctx.strokeStyle = '#ff9d3a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(px, py, rp + 1, 0, 7); ctx.stroke();
      } else {
        if (b.type === 'star') {
          const gr = ctx.createRadialGradient(px, py, 0, px, py, rp * 2.6);
          gr.addColorStop(0, b.color); gr.addColorStop(0.4, b.color + '66'); gr.addColorStop(1, b.color + '00');
          ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(px, py, rp * 2.6, 0, 7); ctx.fill();
        }
        ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(px, py, rp, 0, 7); ctx.fill();
      }
      if (b.id === selectedId) {
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(px, py, rp + 5, 0, 7); ctx.stroke(); ctx.setLineDash([]);
        // velocity arrow (relative to the dominant attractor), 80 px = circular speed
        const ref = referenceBody(b);
        const rel = ref ? V.sub(b.vel, ref.vel) : b.vel;
        const vc = this.refSpeed(b.pos, b);
        this.arrow(ctx, px, py, px + rel[0] / vc * 80, py - rel[1] / vc * 80, 'rgba(120,200,255,0.8)');
      }
      if (settings.labels && (rp > 2.5 || b.id === selectedId)) {
        ctx.fillStyle = 'rgba(220,226,240,0.8)'; ctx.font = '10px system-ui, sans-serif';
        ctx.fillText(b.name, px + rp + 4, py - rp - 2);
      }
    }
    // interaction feedback
    const d = this.drag;
    if (this.ghost) {
      const g = this.ghost;
      const [px, py] = this.toScreen(g.pos[0], g.pos[1]);
      ctx.strokeStyle = '#ffd08a'; ctx.setLineDash([2, 2]); ctx.beginPath(); ctx.arc(px, py, 6, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      if (g.vel) { this.arrow(ctx, px, py, g.ex, g.ey, '#ffd08a'); this.label(ctx, g.ex + 6, g.ey, fmtNum(V.len(g.vel) / KMS, 3) + ' km/s'); }
    }
    if (d && d.kind === 'vel' && d.vel) {
      const [px, py] = this.toScreen(d.b.pos[0], d.b.pos[1]);
      this.arrow(ctx, px, py, d.ex, d.ey, '#8fd3ff'); this.label(ctx, d.ex + 6, d.ey, fmtNum(V.len(d.vel) / KMS, 3) + ' km/s');
    }

      ctx.beginPath();
      for (let i = 0; i < this.pred.length; i += 2) { const [px, py] = this.toScreen(this.pred[i], this.pred[i + 1]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke(); ctx.setLineDash([]);
    }
    // 3D camera indicator
    const cp = camera.position(), [cx, cy] = this.toScreen(cp[0], cp[1]), [tx, ty] = this.toScreen(camera.target[0], camera.target[1]);
    const ang = Math.atan2(ty - cy, tx - cx);
    const ex = Math.min(Math.max(cx, 8), w - 8), ey = Math.min(Math.max(cy, 8), H - 8);
    ctx.fillStyle = 'rgba(140,220,140,0.85)';
    ctx.beginPath(); ctx.moveTo(ex + 7 * Math.cos(ang), ey + 7 * Math.sin(ang));
    ctx.lineTo(ex + 5 * Math.cos(ang + 2.5), ey + 5 * Math.sin(ang + 2.5)); ctx.lineTo(ex + 5 * Math.cos(ang - 2.5), ey + 5 * Math.sin(ang - 2.5)); ctx.fill();
    // scale bar
    const target = 70 / this.scale;
    const p10 = Math.pow(10, Math.floor(Math.log10(target)));

    const len = nice * this.scale;
    ctx.strokeStyle = '#aab'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(w - 10 - len, H - 22); ctx.lineTo(w - 10, H - 22); ctx.moveTo(w - 10 - len, H - 25); ctx.lineTo(w - 10 - len, H - 19); ctx.moveTo(w - 10, H - 25); ctx.lineTo(w - 10, H - 19); ctx.stroke();
    ctx.fillStyle = '#aab'; ctx.font = '10px system-ui, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(fmtNum(nice, 2) + ' AE', w - 10, H - 27); ctx.textAlign = 'left';
  }
  label(ctx, x, y, t) { ctx.fillStyle = '#fff'; ctx.font = '10px system-ui, sans-serif'; ctx.fillText(t, x, y); }
  arrow(ctx, x0, y0, x1, y1, col) {
    const a = Math.atan2(y1 - y0, x1 - x0), L = Math.hypot(x1 - x0, y1 - y0);

    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - 7 * Math.cos(a - 0.4), y1 - 7 * Math.sin(a - 0.4)); ctx.lineTo(x1 - 7 * Math.cos(a + 0.4), y1 - 7 * Math.sin(a + 0.4)); ctx.fill();

  drawPlainGrid(ctx, w, H) {

    ctx.strokeStyle = 'rgba(120,140,200,0.07)'; ctx.lineWidth = 1;

  niceStep() { const t = 40 / this.scale, p = Math.pow(10, Math.floor(Math.log10(t))); return [1, 2, 5, 10].map(v => v * p).find(v => v >= t); }
  /* "Raumzeit-Gitter": a rubber sheet seen from above. Every grid point is pulled
     towards each mass like the perspective shrink of a funnel of depth

     Purely illustrative (embedding-diagram analogy), scale-free. */
  drawGrid(ctx, w, H) {
    const B = sim.bodies;

    const beta = mMax > 0 ? 0.045 * viewW / mMax : 0;

      for (let j = 0; j <= S; j++) {
        const u = i / N, v = j / S;
        const gx = pass ? x0 + (x1 - x0) * u : x0 + (x1 - x0) * v;
        const gy = pass ? y0 + (y1 - y0) * v : y0 + (y1 - y0) * u;
        const [wx, wy, dep] = warp(gx, gy);
        const [px, py] = this.toScreen(wx, wy);
        if (prev) {
          const t = Math.min(1, (dep + prev[2]) * 0.5);
          ctx.strokeStyle = `rgba(${Math.round(90 + 120 * t)},${Math.round(120 - 40 * t)},${Math.round(210 + 40 * t)},${(0.16 + 0.5 * t).toFixed(3)})`;
          ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(px, py); ctx.stroke();
        }

      }
    }
  }
}

/* =============================================================================
   13. 3D VIEW INPUT & LABELS
   ============================================================================= */
const canvas = document.getElementById('gl');
const labelCanvas = document.getElementById('labels');
let lastFD = null;
function project(fd, p) {      // world point -> CSS pixel (unlensed), null if behind the camera
  const rel = V.sub(p, fd.camWorld);
  const z = V.dot(rel, fd.basis.f);
  if (z <= 1e-9) return null;
  const tanH = Math.tan(settings.fov * Math.PI / 360), W = canvas.clientWidth, H = canvas.clientHeight;
  const x = V.dot(rel, fd.basis.r) / (z * tanH * W / H), y = V.dot(rel, fd.basis.u) / (z * tanH);
  return [((x + viewShift()) * 0.5 + 0.5) * W, (0.5 - y * 0.5) * H, z];
}
function drawLabels(fd) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (labelCanvas.width !== Math.round(W * dpr) || labelCanvas.height !== Math.round(H * dpr)) { labelCanvas.width = Math.round(W * dpr); labelCanvas.height = Math.round(H * dpr); }
  const ctx = labelCanvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!settings.labels) return;
  ctx.font = '11px system-ui, sans-serif';
  for (const b of sim.bodies) {
    const s = project(fd, b.pos);
    if (!s) continue;
    const isSel = b.id === selectedId;
    const rpx = (b.type === 'bh' ? rsOf(b.m) * 2.6 : b.R * settings.bodyScale) / (s[2] * Math.tan(settings.fov * Math.PI / 360)) * H / 2;
    if (isSel) { ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.arc(s[0], s[1], Math.max(8, rpx + 6), 0, 7); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = isSel ? 'rgba(255,230,190,0.95)' : 'rgba(210,218,235,0.7)';

const pointers = new Map();
let drag3 = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; drag3 = { pinch: Math.hypot(a.x - b.x, a.y - b.y) }; return; }
  drag3 = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, pan: e.button === 2 || e.button === 1 || e.shiftKey, moved: false };

});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!drag3) return;
  if (drag3.pinch !== undefined && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    camera.zoom(drag3.pinch / Math.max(d, 1)); drag3.pinch = d; return;
  }
  const dx = e.clientX - drag3.x, dy = e.clientY - drag3.y;
  drag3.x = e.clientX; drag3.y = e.clientY;
  if (Math.hypot(e.clientX - drag3.x0, e.clientY - drag3.y0) > 4) drag3.moved = true;
  if (drag3.pan) {
    const b = camera.basis();
    const k = camera.dist * 2 * Math.tan(settings.fov * Math.PI / 360) / canvas.clientHeight;
    camera.target = V.add(camera.target, V.add(V.mul(b.r, -dx * k), V.mul(b.u, dy * k)));

    let best = null, bd = 22;
    for (const b of sim.bodies) {
      const s = project(lastFD, b.pos);
      if (!s) continue;
      const d = Math.hypot(s[0] - e.offsetX, s[1] - e.offsetY);
      if (d < bd) { bd = d; best = b; }

canvas.addEventListener('pointerup', endDrag3);
canvas.addEventListener('pointercancel', endDrag3);

  const tg = e.target.tagName;

    case 'ArrowLeft': camera.rotate(0.05, 0); break;
    case 'ArrowRight': camera.rotate(-0.05, 0); break;
    case 'ArrowUp': camera.rotate(0, 0.04); break;
    case 'ArrowDown': camera.rotate(0, -0.04); break;
    case '+': case '=': camera.zoom(0.9); break;
    case '-': case '_': camera.zoom(1 / 0.9); break;
    case ' ': togglePause(); break;
    case '[': setTimeScale(settings.timeScale / Math.pow(10, 0.25)); break;
    case ']': setTimeScale(settings.timeScale * Math.pow(10, 0.25)); break;

    case 'm': case 'M': $('mapBox').classList.toggle('hidden'); break;
    case 'Escape': topDown.mode = 'select'; topDown.ghost = null; topDown.drag = null; topDown.pred = null; break;
    case 'Delete': if (selected()) deleteBody(selected()); break;

/* =============================================================================
   14. MAIN LOOP
   ============================================================================= */
let renderer;
try { renderer = new Renderer(canvas); } catch (err) { console.error(err); }
const hud = document.getElementById('hud');
let lastT = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0, msFrame = 0;
const t0 = performance.now();
const NO_LOOP = location.hash.includes('noloop');   // test hook: drive frames manually via __app.tick()
function frame(now) {
  tick(now);
  if (!NO_LOOP) requestAnimationFrame(frame);
}
let visClock = 0;                 // visual clock (s) for animated textures; frozen while paused
let lastUiRefresh = 0, seenEvents = 0;
const aq = { t: 0, n: 0 };
let simMovedThisFrame = false;
let physInfo = { frac: 1, steps: 0, ms: 0 };
let energyDrift = 0;
const jump = { active: false, remaining: 0, total: 0 };

/* Time per real second at a given time scale, human readable. */
function fmtRate(ts) {
  const d = ts;                                  // days per second (1× = 1 day/s)
  if (d < 1) return (d * 24).toPrecision(2) + ' h/s';
  if (d < 365.25) return d.toPrecision(3) + ' Tage/s';
  const y = d / 365.25;
  if (y < 1e3) return y.toPrecision(3) + ' Jahre/s';

function startJump(mult) {

}
function singleStep() { sim.advance(settings.timeScale * DAY / 60, 200, false); simMovedThisFrame = true; }

function updateCameraFollow() {

  if (camera.follow === 'bh') tgt = primaryBH();
  else if (camera.follow === 'sel') tgt = selected();
  if (tgt) camera.target = tgt.pos.slice();
  else if (camera.follow !== 'free') camera.follow = 'free';
}

function tick(now) {
  const dtReal = Math.min(0.1, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  fpsAcc += dtReal; fpsN++;
  if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; msFrame = 1000 * fpsAcc / fpsN; fpsAcc = 0; fpsN = 0; }

  // ---------------- physics
  const tBefore = sim.t;
  if (jump.active) {
    const r = sim.advance(jump.remaining, 45, false);
    jump.remaining -= r.done;
    if (jump.remaining <= jump.total * 1e-12 || sim.n === 0) { jump.active = false; jump.remaining = 0; }
  } else if (!settings.paused && sim.n > 0) {
    physInfo = sim.advance(settings.timeScale * DAY * dtReal, settings.physBudget, !settings.accuracyFirst);
  } else physInfo = { frac: 1, steps: 0, ms: 0 };

      else if (f > 45 && settings.resScale < settings.userResScale) settings.resScale = Math.min(settings.userResScale, settings.resScale * 1.08);
    }
    aq.t = 0; aq.n = 0;
  }

  // ---------------- camera + render
  updateCameraFollow();
  const fd = buildFrameData(visClock);
  renderer.render(fd, settings);
  const ov = buildOverlay(fd);
  renderer.drawLines(ov.data, ov.strips, viewProj(fd.basis, settings.fov, canvas.width / canvas.height));
  simMovedThisFrame = false;
  lastFD = fd;
  drawLabels(fd);
  topDown.draw();
  // UI refresh ~8x per second; new simulation events become toasts
  if (now - lastUiRefresh > 120) {
    lastUiRefresh = now;
    for (const f of ui.refreshers) f();

    if (seenEvents > sim.events.length) seenEvents = sim.events.length;

    `${fps.toFixed(0)} fps · ${msFrame.toFixed(1)} ms/Frame · Physik ${physInfo.ms.toFixed(1)} ms\n` +
    `Zeit  ${fmtTime(sim.t)}\n` +
    `Tempo ×${fmtNum(settings.timeScale, 3)} (${fmtRate(settings.timeScale)})${settings.paused ? ' – PAUSE' : ''}\n` +
    `Energiedrift ${energyDrift === 0 ? '0' : energyDrift.toExponential(1)} · Körper ${sim.bodies.length}` +
    (sim.debris.n ? ` · Trümmer ${sim.debris.n}` : '') + `\nSchritte/Frame ${physInfo.steps} · Auflösung ${renderer.rw}×${renderer.rh}` +

$('panelBtn').addEventListener('click', () => togglePanel(true));
